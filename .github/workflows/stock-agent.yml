name: Stock Agent

on:
  schedule:
    # 08:20 ເວລາລາວ (UTC+7) = 01:20 UTC
    - cron: "20 1 * * *"
  workflow_dispatch: {} # ສາມາດກົດແລ່ນເອງຈາກແຖບ Actions ໃນ GitHub

permissions:
  contents: write # ໃຫ້ສິດ commit ໄຟລ໌ລາຄາກັບເຂົ້າ repo

concurrency:
  group: stock-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis

      - name: Run stock agent
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}
        run: node stock-agent/stock-agent.js

      - name: Commit updated price file
        run: |
          git config user.name "Stock Agent Bot"
          git config user.email "actions@github.com"
          git add stock-agent/data/price.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "ອັບເດດລາຄາຫຸ້ນປະຈຳວັນ"

          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 2
          done
          exit 1