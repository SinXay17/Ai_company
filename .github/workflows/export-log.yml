name: Export Log

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: export-log
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Export sanitized log from Google Sheets
        run: npm run export-log
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}

      - name: Commit log.json (rebase and retry)
        id: commit
        shell: bash
        run: |
          file="office-web/public/data/log.json"
          if [ -z "$(git status --porcelain -- "$file")" ]; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore(office-web): export sanitized log"

          pushed=0
          for attempt in 1 2 3 4 5; do
            if git fetch origin "$GITHUB_REF_NAME" &&
              git rebase "origin/$GITHUB_REF_NAME" &&
              git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          if [ "$pushed" != "1" ]; then
            echo "::error::Push failed after five attempts."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
